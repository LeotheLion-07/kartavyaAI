version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kartavya-db
    environment:
      POSTGRES_USER: kartavya_user
      POSTGRES_PASSWORD: kartavya_secure_password
      POSTGRES_DB: kartavya_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kartavya_user -d kartavya_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: kartavya-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kartavya-backend
    environment:
      DATABASE_URL: postgresql://kartavya_user:kartavya_secure_password@db:5432/kartavya_ai
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: kartavya-super-secure-jwt-secret-key-production-grade-2026
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kartavya-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
